name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the dataset parses
        run: node -e "const m=require('./data/people.js');
          const s=new Set(m.people.map(p=>p.slug));
          m.people.forEach(p=>{ if(p.reportsTo && !s.has(p.reportsTo)) { throw new Error('bad reportsTo: '+p.slug); } });
          console.log(m.people.length+' people, '+m.timeline.length+' timeline entries');"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
